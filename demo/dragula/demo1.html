<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragula DEMO</title>
    <link rel="stylesheet" href="./dragula/dist/dragula.css" />
    <style>
      body {
        background-color: #942a57;
        margin: 100px auto;
        max-width: 760px;
      }

      html,
      body {
        -webkit-box-sizing: border-box;
        -moz-box-sizing: border-box;
        box-sizing: border-box;
      }
      body,
      input,
      button {
        font-family: Georgia, Helvetica;
        font-size: 17px;
        color: #ecf0f1;
      }
      .wrapper {
        display: table;
      }
      .container {
        display: table-cell;
        background-color: rgba(255, 255, 255, 0.2);
        width: 50%;
      }
      .container:nth-child(odd) {
        background-color: rgba(0, 0, 0, 0.2);
      }
      .container > div,
      .gu-mirror {
        margin: 10px;
        padding: 10px;
        background-color: rgba(0, 0, 0, 0.2);
        transition: opacity 0.4s ease-in-out;
      }
      .container > div {
        cursor: move;
        cursor: grab;
        cursor: -moz-grab;
        cursor: -webkit-grab;
      }
      .gu-mirror {
        cursor: grabbing;
        cursor: -moz-grabbing;
        cursor: -webkit-grabbing;
      }
      .container .ex-moved {
        background-color: #e74c3c;
      }
      .container.ex-over {
        background-color: rgba(255, 255, 255, 0.3);
      }
      #left-lovehandles > div,
      #right-lovehandles > div {
        cursor: initial;
      }
      .handle {
        padding: 0 5px;
        margin-right: 5px;
        background-color: rgba(0, 0, 0, 0.4);
        cursor: move;
      }
      .image-thing {
        margin: 20px 0;
        display: block;
        text-align: center;
      }
      .slack-join {
        position: absolute;
        font-weight: normal;
        font-size: 14px;
        right: 10px;
        top: 50%;
        margin-top: -8px;
        line-height: 16px;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div id="left-defaults" class="container">
        <div>1. 可以在两个列表之间移动元素</div>
        <div>2. 可以移动到任意位置</div>
        <div>3. 任何元素都可以被移动</div>
      </div>
      <div id="right-defaults" class="container">
        <div>A. 你可以在同一个容器中移动元素，改变它的位置</div>
        <div>B. 这是默认用例。</div>
        <div>C. 提供很多配置项</div>
      </div>
    </div>
    <script src="./dragula/dist/dragula.js"></script>
    <script>
      dragula([$('left-defaults'), $('right-defaults')])
      function $(id) {
        return document.getElementById(id)
      }
    </script>
  </body>
</html>
