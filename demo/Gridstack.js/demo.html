<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridstack.js 美化示例 - 居中显示</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/gridstack.js/7.2.3/gridstack.min.css" />
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }
        .container {
            width: 80%;
            max-width: 1200px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: #4a4a4a;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        .grid-stack {
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .grid-stack-item-content {
            text-align: center;
            background: linear-gradient(45deg, #3498db, #2980b9);
            color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .grid-stack-item-content:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gridstack.js 演示</h1>
        <div class="grid-stack"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gridstack.js/7.2.3/gridstack-all.js"></script>
    <script>
        const grid = GridStack.init({
            cellHeight: 80,
            margin: 10,
            minRow: 5 // 确保网格至少有5行高
        });
        grid.load([
            { x: 0, y: 0, width: 4, height: 2, content: '1' },
            { x: 4, y: 0, width: 4, height: 4, content: '2' },
            { x: 8, y: 0, width: 4, height: 2, content: '3' },
            { x: 0, y: 2, width: 4, height: 2, content: '4' },
            { x: 8, y: 2, width: 4, height: 2, content: '5' }
        ]);
    </script>
</body>
</html>
