<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScrollMagic Example</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #f0f0f0;
        }
        .section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            color: #fff;
            transition: background-color 0.5s ease;
        }
        .section:nth-child(odd) {
            /* background-color: #1abc9c; */
            background: url(./images/img_1.jpg) no-repeat center center;
            background-size: cover;
        }
        .section:nth-child(even) {
            background-color: #3498db;
            background: url(./images/img_2.jpg) no-repeat center center;
            background-size: cover;
        }
        .pin {
            background: url(./images/img_3.jpg) no-repeat center center;
            background-size: cover;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            transform: scale(1);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }
        .pin:hover {
            transform: scale(1.1);
            background-color: #c0392b;
            background: url(./images/img_4.jpg) no-repeat center center;
            background-size: cover;
        }
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            font-size: 1.5em;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="header">ScrollMagic Example</div>
    <div class="section">Scroll down to see the magic!</div>
    <div class="section pin">This section will be pinned.</div>
    <div class="section">Keep scrolling...</div>

    <!-- ScrollMagic and GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ScrollMagic/2.0.8/ScrollMagic.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ScrollMagic/2.0.8/plugins/animation.gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ScrollMagic/2.0.8/plugins/debug.addIndicators.min.js"></script>

    <script>
        // 初始化 ScrollMagic 控制器
        var controller = new ScrollMagic.Controller();

        // 创建一个场景
        var scene = new ScrollMagic.Scene({
            triggerElement: ".pin", // 触发动画的元素
            triggerHook: 0.5, // 在视口中间触发
            duration: "100%" // 固定元素的持续时间为视口高度
        })
        .setPin(".pin") // 固定元素
        .addIndicators() // 添加指示器（需要 debug.addIndicators.js）
        .addTo(controller); // 将场景添加到控制器
    </script>
</body>
</html>
