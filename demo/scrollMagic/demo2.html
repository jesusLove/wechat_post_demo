<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ScrollMagic 进阶示例</title>
  <style>
    /* 添加一些基本样式 */
    body { margin: 0; padding: 0; }
    .section { height: 100vh; display: flex; justify-content: center; align-items: center; font-size: 2em; }
    /* #trigger { height: 100vh; } */
    #animate { width: 100px; height: 100px; background-color: #3498db; transition: all 0.5s ease; }
  </style>
</head>
<body>
  <div class="section">滚动查看动画效果</div>
  <div id="trigger"></div>
  <div class="section">
    <div id="animate"></div>
  </div>
  <div class="section">动画结束</div>

  <!-- 引入必要的脚本 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ScrollMagic/2.0.8/ScrollMagic.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ScrollMagic/2.0.8/plugins/debug.addIndicators.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ScrollMagic/2.0.8/plugins/animation.gsap.min.js"></script>

  <script>
    // 初始化 ScrollMagic
    var controller = new ScrollMagic.Controller();

    // 创建 GSAP 动画
    var tween = gsap.to("#animate", {
      scale: 2,
      rotation: 360,
      backgroundColor: "#e74c3c",
      duration: 1
    });

    // 创建场景
    var scene = new ScrollMagic.Scene({
      triggerElement: "#trigger",
      duration: "100%"
    })
    .setTween(tween)
    .addIndicators() // 添加调试指示器
    .addTo(controller);
  </script>
</body>
</html>
